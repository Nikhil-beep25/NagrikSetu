<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%" fill="none" opacity="0.06">
  <defs>
    <radialGradient id="ashokaGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0B1F50" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#244A85" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#F47721" stop-opacity="0.1"/>
    </radialGradient>
  </defs>
  <g transform="translate(400, 400)">
    <!-- Concentric Rings -->
    <circle r="360" stroke="#0B1F50" stroke-width="1.5" stroke-dasharray="6 6"/>
    <circle r="320" stroke="#F47721" stroke-width="1"/>
    <circle r="260" stroke="#0B1F50" stroke-width="2"/>
    <circle r="220" stroke="#13865B" stroke-width="1" stroke-dasharray="4 4"/>
    <circle r="160" stroke="#0B1F50" stroke-width="2"/>
    <circle r="100" stroke="#F47721" stroke-width="1.5"/>
    <circle r="40" stroke="#0B1F50" stroke-width="2" fill="url(#ashokaGrad)"/>
    <circle r="16" fill="#0B1F50"/>

    <!-- 24 Sacred Spokes of Ashoka Chakra -->
    <g stroke="#0B1F50" stroke-width="1.5">
      <line x1="0" y1="-260" x2="0" y2="-40"/>
      <line x1="0" y1="40" x2="0" y2="260"/>
      <line x1="-260" y1="0" x2="-40" y2="0"/>
      <line x1="40" y1="0" x2="260" y2="0"/>

      <line x1="0" y1="-260" x2="0" y2="-40" transform="rotate(15)"/>
      <line x1="0" y1="-260" x2="0" y2="-40" transform="rotate(30)"/>
      <line x1="0" y1="-260" x2="0" y2="-40" transform="rotate(45)"/>
      <line x1="0" y1="-260" x2="0" y2="-40" transform="rotate(60)"/>
      <line x1="0" y1="-260" x2="0" y2="-40" transform="rotate(75)"/>
      <line x1="0" y1="-260" x2="0" y2="-40" transform="rotate(90)"/>
      <line x1="0" y1="-260" x2="0" y2="-40" transform="rotate(105)"/>
      <line x1="0" y1="-260" x2="0" y2="-40" transform="rotate(120)"/>
      <line x1="0" y1="-260" x2="0" y2="-40" transform="rotate(135)"/>
      <line x1="0" y1="-260" x2="0" y2="-40" transform="rotate(150)"/>
      <line x1="0" y1="-260" x2="0" y2="-40" transform="rotate(165)"/>

      <line x1="0" y1="40" x2="0" y2="260" transform="rotate(15)"/>
      <line x1="0" y1="40" x2="0" y2="260" transform="rotate(30)"/>
      <line x1="0" y1="40" x2="0" y2="260" transform="rotate(45)"/>
      <line x1="0" y1="40" x2="0" y2="260" transform="rotate(60)"/>
      <line x1="0" y1="40" x2="0" y2="260" transform="rotate(75)"/>
      <line x1="0" y1="40" x2="0" y2="260" transform="rotate(90)"/>
      <line x1="0" y1="40" x2="0" y2="260" transform="rotate(105)"/>
      <line x1="0" y1="40" x2="0" y2="260" transform="rotate(120)"/>
      <line x1="0" y1="40" x2="0" y2="260" transform="rotate(135)"/>
      <line x1="0" y1="40" x2="0" y2="260" transform="rotate(150)"/>
      <line x1="0" y1="40" x2="0" y2="260" transform="rotate(165)"/>
    </g>

    <!-- Outer Decorative Petals -->
    <g stroke="#F47721" stroke-width="1" opacity="0.7">
      <path d="M0 -320 Q 20 -340 0 -360 Q -20 -340 0 -320 Z"/>
      <path d="M0 -320 Q 20 -340 0 -360 Q -20 -340 0 -320 Z" transform="rotate(30)"/>
      <path d="M0 -320 Q 20 -340 0 -360 Q -20 -340 0 -320 Z" transform="rotate(60)"/>
      <path d="M0 -320 Q 20 -340 0 -360 Q -20 -340 0 -320 Z" transform="rotate(90)"/>
      <path d="M0 -320 Q 20 -340 0 -360 Q -20 -340 0 -320 Z" transform="rotate(120)"/>
      <path d="M0 -320 Q 20 -340 0 -360 Q -20 -340 0 -320 Z" transform="rotate(150)"/>
      <path d="M0 -320 Q 20 -340 0 -360 Q -20 -340 0 -320 Z" transform="rotate(180)"/>
      <path d="M0 -320 Q 20 -340 0 -360 Q -20 -340 0 -320 Z" transform="rotate(210)"/>
      <path d="M0 -320 Q 20 -340 0 -360 Q -20 -340 0 -320 Z" transform="rotate(240)"/>
      <path d="M0 -320 Q 20 -340 0 -360 Q -20 -340 0 -320 Z" transform="rotate(270)"/>
      <path d="M0 -320 Q 20 -340 0 -360 Q -20 -340 0 -320 Z" transform="rotate(300)"/>
      <path d="M0 -320 Q 20 -340 0 -360 Q -20 -340 0 -320 Z" transform="rotate(330)"/>
    </g>
  </g>
</svg>
